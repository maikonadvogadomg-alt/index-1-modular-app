<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio</title>
<link rel="stylesheet" href="css/01-estilo.css">
  <!-- PWA:inicio (gerado pelo Mini SK — pode refazer no painel 📱 PWA) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00ffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      addEventListener('load', function () { navigator.serviceWorker.register('service-worker.js').catch(function (e) { console.warn('Service worker:', e); }); });
    }
  </script>
  <!-- PWA:fim -->
</head>
<body>
<div id="app">

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div id="sidebar-header">
      <span>🤖</span>
      <h1>AI Studio</h1>
      <button id="btn-novo-chat" title="Novo chat">+ Novo</button>
    </div>
    <div id="lista-chats"></div>
    <div id="sidebar-footer">
      <button class="btn-sidebar" id="btn-exportar-chat">📥 Exportar conversa</button>
      <button class="btn-sidebar" id="btn-importar-chat">📤 Importar conversa</button>
      <button class="btn-sidebar" id="btn-abrir-config">⚙️ Configurações</button>
    </div>
  </aside>

  <!-- OVERLAY MOBILE -->
  <div id="overlay-sidebar"></div>

  <!-- MAIN -->
  <main id="main">

    <!-- TOPBAR -->
    <div id="topbar">
      <button id="btn-menu" title="Menu">☰</button>
      <select id="select-modelo" title="Modelo de IA"></select>
      <div id="info-tokens">
        <span id="badge-tokens" class="badge-custo" style="display:none">0 tokens</span>
      </div>
      <button id="btn-config" title="Configurações">⚙️</button>
    </div>

    <!-- MENSAGENS -->
    <div id="mensagens">
      <!-- Tela vazia inicial -->
      <div id="tela-vazia">
        <div class="icone">⚡</div>
        <h2>AI Studio</h2>
        <p>Chat leve e econômico com suporte a múltiplas IAs</p>
        <div class="sugestoes-grid">
          <button class="sugestao-btn" data-texto="Resuma este texto jurídico para mim:">📄 Resumir texto</button>
          <button class="sugestao-btn" data-texto="Analise este documento e aponte os pontos principais:">🔍 Analisar documento</button>
          <button class="sugestao-btn" data-texto="Corrija e melhore este texto:">✏️ Corrigir texto</button>
          <button class="sugestao-btn" data-texto="Explique de forma simples:">💡 Explicar</button>
        </div>
      </div>
    </div>

    <!-- INPUT -->
    <div id="input-area">
      <div id="fila-anexos"></div>
      <div id="barra-input">
        <button id="btn-anexar" title="Anexar arquivo/imagem">📎</button>
        <input type="file" id="input-arquivo" multiple
          accept="image/*,.pdf,.txt,.md,.js,.ts,.jsx,.tsx,.html,.css,.json,.xml,.csv,.zip,.py,.java,.c,.cpp,.cs,.php,.rb,.go,.rs,.sql">
        <textarea id="campo-texto" placeholder="Digite sua mensagem..." rows="1"></textarea>
        <button id="btn-voz" title="Falar">🎤</button>
        <button id="btn-enviar" title="Enviar">➤</button>
      </div>
    </div>

  </main>

  <!-- PAINEL DE CONFIGURAÇÕES -->
  <aside id="painel-config">
    <div id="config-header">
      <h2>⚙️ Configurações</h2>
      <button id="btn-fechar-config">✕</button>
    </div>
    <div id="config-corpo">

      <div class="config-secao">
        <h3>🔑 Chaves de API</h3>
        <div class="config-campo">
          <label>Monica / OpenAI (sk-...)</label>
          <input type="password" id="cfg-chave-openai" placeholder="sk-...">
        </div>
        <div class="config-campo">
          <label>Google Gemini</label>
          <input type="password" id="cfg-chave-gemini" placeholder="AIza...">
        </div>
        <div class="config-campo">
          <label>Anthropic Claude</label>
          <input type="password" id="cfg-chave-claude" placeholder="sk-ant-...">
        </div>
        <div class="config-campo">
          <label>Ollama (URL local)</label>
          <input type="text" id="cfg-url-ollama" placeholder="http://localhost:11434">
        </div>
        <button class="btn-config-acao" id="btn-salvar-chaves">💾 Salvar chaves</button>
        <button class="btn-config-acao" id="btn-testar-conexao">🔌 Testar conexão</button>
      </div>

      <div class="config-secao">
        <h3>🧠 Comportamento</h3>
        <div class="config-campo">
          <label>Instrução do sistema (prompt)</label>
          <textarea id="cfg-system-prompt" placeholder="Você é um assistente jurídico especializado..."></textarea>
        </div>
        <div class="config-campo">
          <label>Temperatura: <span id="cfg-temp-val">0.7</span></label>
          <input type="range" id="cfg-temperatura" min="0" max="2" step="0.1" value="0.7">
        </div>
        <div class="config-campo">
          <label>Máx. tokens resposta</label>
          <input type="number" id="cfg-max-tokens" value="2048" min="256" max="8192" step="256">
        </div>
        <div class="config-linha">
          <label>Memória de contexto (últimas mensagens)</label>
          <input type="number" id="cfg-contexto" value="10" min="2" max="50" style="width:60px">
        </div>
      </div>

      <div class="config-secao">
        <h3>🖼️ Imagens</h3>
        <div class="config-linha">
          <label>Comprimir imagens antes de enviar</label>
          <div class="toggle ativo" id="toggle-comprimir"></div>
        </div>
        <div class="config-campo">
          <label>Qualidade da compressão: <span id="cfg-qualidade-val">80</span>%</label>
          <input type="range" id="cfg-qualidade" min="30" max="100" step="5" value="80">
        </div>
        <div class="config-campo">
          <label>Tamanho máximo (px)</label>
          <select id="cfg-tamanho-img">
            <option value="512">512px (mais leve)</option>
            <option value="768">768px</option>
            <option value="1024" selected>1024px (padrão)</option>
            <option value="1536">1536px</option>
            <option value="2048">2048px (original)</option>
          </select>
        </div>
        <div class="config-linha">
          <label>Se IA não suporta visão → descrever em texto</label>
          <div class="toggle ativo" id="toggle-fallback-img"></div>
        </div>
      </div>

      <div class="config-secao">
        <h3>🔧 Dados</h3>
        <button class="btn-config-acao" id="btn-exportar-config">📤 Exportar configurações</button>
        <button class="btn-config-acao" id="btn-importar-config">📥 Importar configurações</button>
        <button class="btn-config-acao perigo" id="btn-limpar-chats">🗑️ Apagar todos os chats</button>
        <button class="btn-config-acao perigo" id="btn-limpar-tudo">⚠️ Resetar tudo</button>
      </div>

    </div>
  </aside>

  <!-- LIGHTBOX -->
  <div id="lightbox"><img id="lightbox-img" src="" alt=""></div>

  <!-- TOAST -->
  <div id="toast"></div>

  <!-- INPUT OCULTO IMPORTAR -->
  <input type="file" id="input-importar-chat" accept=".json" style="display:none">
  <input type="file" id="input-importar-config" accept=".json" style="display:none">

</div>
